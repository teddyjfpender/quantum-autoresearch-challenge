name: Evaluator release

# Builds the trusted FeMoco evaluator once per version of the trusted source and publishes it
# as a release asset, so the judge downloads a binary instead of compiling one for every
# submission. The lock file names the release, the binary's SHA-256 and the verifier digest of
# the source it was built from; the judge refuses a binary whose digest is not the current one
# and builds from source instead.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "challenges/femoco/**"
      - "!challenges/femoco/results.tsv"
      - "!challenges/femoco/submissions/**"
      - "!challenges/femoco/evaluator.lock.json"

permissions:
  contents: write

concurrency:
  group: evaluator-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      CHALLENGE: femoco
      ASSET: eval_circuit-linux-x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Is the locked evaluator current?
        id: state
        run: |
          digest="$(python3 challenge.py verifier-digest "$CHALLENGE")"
          locked="$(jq -r '.verifierSha256 // ""' "challenges/$CHALLENGE/evaluator.lock.json" 2>/dev/null || true)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "tag=$CHALLENGE-evaluator-${digest:0:16}" >> "$GITHUB_OUTPUT"
          if [[ "$digest" == "$locked" ]]; then echo "current=true" >> "$GITHUB_OUTPUT"; else echo "current=false" >> "$GITHUB_OUTPUT"; fi
          echo "verifier digest $digest (locked: ${locked:-none})"
      - name: Build the trusted evaluator
        if: steps.state.outputs.current == 'false'
        working-directory: challenges/femoco
        run: |
          # Without the editable walk code: no submission code is linked into the evaluator.
          CARGO_TARGET_DIR="$PWD/target/trusted" cargo build --release --locked --no-default-features --bin eval_circuit
          cp target/trusted/release/eval_circuit "$GITHUB_WORKSPACE/$ASSET"
          strip "$GITHUB_WORKSPACE/$ASSET"
      - name: Publish and lock
        if: steps.state.outputs.current == 'false'
        env:
          DIGEST: ${{ steps.state.outputs.digest }}
          TAG: ${{ steps.state.outputs.tag }}
        run: |
          sha="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          rustc="$(cd "challenges/$CHALLENGE" && rustc --version)"
          jq -n --arg tag "$TAG" --arg digest "$DIGEST" --arg commit "$GITHUB_SHA" --arg asset "$ASSET" \
                --arg sha "$sha" --arg rustc "$rustc" --arg challenge "$CHALLENGE" \
            '{schema: "qac-evaluator-lock-v1", challenge: $challenge, tag: $tag, verifierSha256: $digest,
              sourceCommit: $commit, toolchain: $rustc,
              assets: {"linux-x86_64": {name: $asset, sha256: $sha}}}' > "challenges/$CHALLENGE/evaluator.lock.json"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing its asset is refused. Delete the release to rebuild." >&2
            exit 1
          fi
          gh release create "$TAG" "$ASSET" "challenges/$CHALLENGE/evaluator.lock.json" \
            --target "$GITHUB_SHA" --title "FeMoco evaluator ${DIGEST:0:16}" \
            --notes "Trusted evaluator for the FeMoco challenge, built from $GITHUB_SHA without the editable circuit code. Verifier digest \`$DIGEST\`. Binary SHA-256 \`$sha\`."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "challenges/$CHALLENGE/evaluator.lock.json"
          git commit -m "Lock FeMoco evaluator ${DIGEST:0:16}"
          git pull --rebase origin main
          git push origin HEAD:main
