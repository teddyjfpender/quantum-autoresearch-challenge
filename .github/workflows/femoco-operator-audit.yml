name: FeMoco operator audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/femoco-operator-audit.yml'
      - 'challenges/femoco/tools/verification/**'
      - 'challenges/femoco/tools/repro/audit_encoded.py'

permissions:
  contents: read

concurrency:
  group: femoco-operator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.current.outputs.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check whether complete evidence matches the current inputs and checker
        id: current
        run: |
          # A manual dispatch always reruns the expensive proof. PR updates can reuse
          # committed evidence only when all source, input and coverage checks pass.
          if [ '${{ github.event_name }}' != workflow_dispatch ] && \
             [ -f challenges/femoco/rigorous/operator-reiher.json ] && \
             [ -f challenges/femoco/rigorous/operator-li.json ] && \
             python3 -m unittest discover -s tests -p test_encoded_operator_evidence.py -v; then
            echo 'required=false' >> "$GITHUB_OUTPUT"
            echo 'Complete committed operator evidence matches the current inputs and checker.'
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi

  batch:
    needs: evidence
    if: github.event.repository.private == false && needs.evidence.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        candidate:
          - name: reiher
            submission: reiher/outer-hi-reconstruct-r1
          - name: li
            submission: li/composed-alias-m8
        begin: [0, 16, 32, 48, 64, 80, 96, 112, 128, 144, 160, 176, 192, 208, 224, 240]
    name: ${{ matrix.candidate.name }}-${{ matrix.begin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: femoco-${{ runner.os }}-${{ hashFiles('challenges/femoco/Cargo.lock', 'challenges/femoco/rust-toolchain') }}
      - name: Toolchain and verification dependencies
        working-directory: challenges/femoco
        run: |
          rustup show active-toolchain || rustup toolchain install
          python3 -m pip install -r tools/verification/requirements.txt
      - name: Rebuild pinned circuit and prove the requested batch
        working-directory: challenges/femoco
        run: |
          proof_begin=${{ matrix.begin }}
          proof_end=$((proof_begin + 16))
          python3 tools/repro/audit_encoded.py --out-root /tmp/operator-audit \
            --submission '${{ matrix.candidate.submission }}' \
            --partition-bits 8 --partition-range "${proof_begin}:${proof_end}" --jobs 4
      - name: Preserve partition evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-${{ matrix.candidate.name }}-${{ matrix.begin }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            /tmp/operator-audit/**/operator-report.json
            /tmp/operator-audit/**/operator.log
            /tmp/operator-audit/**/build.log
            /tmp/operator-audit/audit-results.json

  assemble:
    needs: [evidence, batch]
    if: github.event.repository.private == false && needs.evidence.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: operator-*
          path: /tmp/operator-batches
      - name: Require complete matching evidence for both operators
        run: |
          python3 challenges/femoco/tools/verification/assemble.py \
            --root /tmp/operator-batches --out /tmp/operator-certificates
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: operator-certificates
          path: /tmp/operator-certificates/*.json
          retention-days: 1
          if-no-files-found: error
