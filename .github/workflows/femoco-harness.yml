name: FeMoco harness

# Format, lints and the full test suite of the FeMoco challenge, including the byte-identity
# pins of every recorded circuit. Submission pull requests are judged by judge.yml instead.
on:
  push:
    branches: [main]
    paths:
      - "challenges/femoco/**"
      - "!challenges/femoco/results.tsv"
      - "!challenges/femoco/submissions/**"
      - "!challenges/femoco/**/*.md"
      - ".github/workflows/femoco-harness.yml"
  pull_request:
    paths:
      - "challenges/femoco/**"
      - "!challenges/femoco/results.tsv"
      - "!challenges/femoco/submissions/**"
      - "!challenges/femoco/**/*.md"
      - ".github/workflows/femoco-harness.yml"

permissions:
  contents: read

concurrency:
  group: femoco-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: challenges/femoco
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: femoco-${{ runner.os }}-${{ hashFiles('challenges/femoco/Cargo.lock', 'challenges/femoco/rust-toolchain') }}
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests and pins
        run: cargo test --release --locked -- --test-threads=4
      # Only main may write the cache, and it holds downloaded crates only: build outputs are
      # never cached, so nothing compiled from one commit's circuit code runs for another.
      - name: Save cargo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: femoco-${{ runner.os }}-${{ hashFiles('challenges/femoco/Cargo.lock', 'challenges/femoco/rust-toolchain') }}
